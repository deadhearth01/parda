name: PII leak / missed detection
description: parda let personal data through, or redacted something it should not have
labels: [detection]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Use a synthetic example — never the real data
        Reproduce the miss with invented text of the same *shape* (same kind of name, same ID format, same language mix). For example, if a real Aadhaar number was missed, give a made-up 12-digit number in the same layout.
        If the miss lets a checksum-validated identifier or a secret through in a way that looks systematic, report it privately as a security advisory instead (see SECURITY.md).
  - type: textarea
    id: text
    attributes:
      label: Synthetic input text
      description: The smallest invented text that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have been (or not been) redacted
    validations:
      required: true
  - type: textarea
    id: scan
    attributes:
      label: Output of `parda scan --json "<your synthetic text>"`
      render: json
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Proxy (Claude Code / Codex / SDK)
        - Clipboard paste-safe
        - CLI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: parda version, model (`parda model list`) and OS
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The text above is synthetic and contains no real person's data.
          required: true
