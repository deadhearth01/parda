version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions change APIs: upgrade deliberately, not by bot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned together: gline-rs requires this exact ONNX Runtime binding.
      - dependency-name: ort
      - dependency-name: tokenizers
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
