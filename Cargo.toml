[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/gline-rs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/deadhearth01/parda"
authors = ["The parda contributors"]

[workspace.dependencies]
# internal
parda-core = { path = "crates/parda-core" }
parda-detect = { path = "crates/parda-detect" }
parda-vault = { path = "crates/parda-vault" }
parda-ml = { path = "crates/parda-ml" }
parda-engine = { path = "crates/parda-engine" }
parda-proxy = { path = "crates/parda-proxy" }
parda-ipc = { path = "crates/parda-ipc" }
parda-daemon = { path = "crates/parda-daemon" }
parda-clip = { path = "crates/parda-clip" }
parda-tui = { path = "crates/parda-tui" }

# general
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
regex = "1"
aho-corasick = "1"
blake3 = "1"
lru = "0.16"
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
directories = "6"

# async / http
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "json", "http2"] }
bytes = "1"
futures = "0.3"
http = "1"
http-body-util = "0.1"
tower = "0.5"

# crypto / storage
rusqlite = { version = "0.37", features = ["bundled"] }
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.10"
rand_chacha = "0.3"
zeroize = { version = "1", features = ["derive"] }
keyring = "3"

# ml
ort = { version = "=2.0.0-rc.9" }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
gline-rs = "1.1"
ndarray = "0.16"

# os integration
interprocess = { version = "2", features = ["tokio"] }
arboard = "3"
global-hotkey = "0.7"
enigo = "0.6"

# ui / cli
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.11"
indicatif = "0.17"

# test
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# Vendored with a small patch (see vendor/gline-rs/PARDA_PATCH.md).
gline-rs = { path = "vendor/gline-rs" }
