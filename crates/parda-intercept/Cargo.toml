[package]
name = "parda-intercept"
description = "Local HTTPS interception proxy: decrypts only listed AI hosts, rewrites their bodies, tunnels everything else"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
parda-core.workspace = true
parda-engine.workspace = true
parda-wire.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
tokio.workspace = true
reqwest.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
rcgen.workspace = true
time = "0.3"
rand.workspace = true
zeroize.workspace = true
# Keep the key order of JSON bodies we rewrite.
serde_json = { workspace = true, features = ["preserve_order"] }
form_urlencoded = "1"
percent-encoding = "2"

[dev-dependencies]
# The fake upstream speaks HTTP/2 like real AI sites.
hyper = { workspace = true, features = ["http2"] }
x509-parser = "0.18"
parda-detect.workspace = true
tempfile.workspace = true
proptest.workspace = true
flate2 = "1"

[lints]
workspace = true
